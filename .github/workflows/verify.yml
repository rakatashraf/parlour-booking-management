name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend integration tests against Firestore Emulator
        run: npx --yes firebase-tools@15.30.1 emulators:exec --only firestore --project demo-parlour-booking-management --config firebase/firebase.json "mvn -B -ntp -f backend/pom.xml verify"
  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase rules test dependencies
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Test Firestore security rules
        working-directory: firebase
        run: npx --yes firebase-tools@15.30.1 emulators:exec --only firestore --project demo-parlour-booking-management "npm run test:rules"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Write Android Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f android/app/google-services.example.json ]; then
            cp android/app/google-services.example.json android/app/google-services.json
          else
            echo 'Add repository secret GOOGLE_SERVICES_JSON with your Android Firebase configuration.'
            exit 1
          fi
      - name: Build debug app and check lint
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Parlour-Booking-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
  android-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Write Android Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f android/app/google-services.example.json ]; then
            cp android/app/google-services.example.json android/app/google-services.json
          else
            echo 'Add repository secret GOOGLE_SERVICES_JSON with your Android Firebase configuration.'
            exit 1
          fi
      - name: Run Android UI smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon -p android connectedDebugAndroidTest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        run: docker build -f backend/Dockerfile -t parlour-api:ci backend
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure Android SDK for CodeQL build
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual
      - name: Build backend and Android sources for CodeQL
        run: |
          mvn -B -ntp -f backend/pom.xml -DskipTests package
          gradle --no-daemon -p android assembleDebug
      - uses: github/codeql-action/analyze@v3
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, firebase-rules, android, android-ui, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Parlour-Booking-Debug
          path: apk
      - name: Publish installable development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          preview_tag="preview-${GITHUB_SHA:0:12}"
          cp apk/app-debug.apk Parlour-Booking-Debug.apk
          sha256sum Parlour-Booking-Debug.apk > SHA256SUMS.txt
          gh release create "$preview_tag" Parlour-Booking-Debug.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Parlour Booking development preview" \
            --notes-file docs/PREVIEW_RELEASE.md
