name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: parlour_test
          MYSQL_USER: parlour_test
          MYSQL_PASSWORD: disposable-ci-test-password
          MYSQL_ROOT_PASSWORD: disposable-ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pdisposable-ci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test booking invariants on MySQL
        env:
          MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/parlour_test?connectionTimeZone=UTC
          MYSQL_TEST_USER: parlour_test
          MYSQL_TEST_PASSWORD: disposable-ci-test-password
        run: mvn -B -ntp -f backend/pom.xml -Dtest=MySqlIntegrationTest test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Write Android Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f android/app/google-services.example.json ]; then
            cp android/app/google-services.example.json android/app/google-services.json
          else
            echo 'Add repository secret GOOGLE_SERVICES_JSON with your Android Firebase configuration.'
            exit 1
          fi
      - name: Build debug app and check lint
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Parlour-Booking-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, mysql, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Parlour-Booking-Debug
          path: apk
      - name: Publish installable development preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          preview_tag="preview-${GITHUB_SHA:0:12}"
          cp apk/app-debug.apk Parlour-Booking-Debug.apk
          sha256sum Parlour-Booking-Debug.apk > SHA256SUMS.txt
          gh release create "$preview_tag" Parlour-Booking-Debug.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "Parlour Booking development preview" \
            --notes-file docs/PREVIEW_RELEASE.md
