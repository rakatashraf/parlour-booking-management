name: Deploy Firebase rules and indexes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
      - run: npm install -g firebase-tools
      - name: Deploy Firestore indexes/rules and Storage rules
        working-directory: firebase
        run: firebase deploy --only firestore,storage --project parlour-booking-management --non-interactive
