services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: parlour
      MYSQL_USER: parlour
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      retries: 15
  api:
    build: ./backend
    restart: unless-stopped
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/public/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      start-period: 60s
      retries: 3
    environment:
      DB_URL: jdbc:mysql://mysql:3306/parlour?connectionTimeZone=UTC
      DB_USER: parlour
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_LIVE: ${SSLCOMMERZ_LIVE:-false}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      FIRESTORE_SYNC_MS: ${FIRESTORE_SYNC_MS:-300000}
      FIRESTORE_SYNC_INITIAL_DELAY_MS: ${FIRESTORE_SYNC_INITIAL_DELAY_MS:-15000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      mysql: {condition: service_healthy}
volumes:
  mysql-data:
