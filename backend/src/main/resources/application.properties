spring.application.name=parlour-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parlour?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:parlour}
spring.datasource.password=${DB_PASSWORD}
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
app.jwt-secret=${JWT_SECRET}
app.firebase-enabled=${FIREBASE_ENABLED:false}
app.firebase-project=parlour-booking-management
app.firebase-bucket=parlour-booking-management.firebasestorage.app
app.public-url=${PUBLIC_API_URL:http://localhost:8080}
app.ssl-store-id=${SSLCOMMERZ_STORE_ID:}
app.ssl-store-password=${SSLCOMMERZ_STORE_PASSWORD:}
app.ssl-live=${SSLCOMMERZ_LIVE:false}
app.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.firestore-sync-ms=${FIRESTORE_SYNC_MS:300000}
app.firestore-sync-initial-delay-ms=${FIRESTORE_SYNC_INITIAL_DELAY_MS:15000}
