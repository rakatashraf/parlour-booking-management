plugins { id 'com.android.application'; id 'com.google.gms.google-services'; id 'com.google.firebase.crashlytics' }
def configuredApiBase = project.findProperty('API_BASE_URL')
// Release signing setup (documented for the release manager):
//   Option 1 (recommended): create a keystore.properties file NEXT TO THE REPO ROOT containing:
//       storeFile=/absolute/path/to/release.keystore
//       storePassword=your-store-password
//       keyAlias=your-key-alias
//       keyPassword=your-key-password
//   Option 2: set environment variables PARLOUR_KEYSTORE, PARLOUR_STORE_PASSWORD, PARLOUR_KEY_ALIAS, PARLOUR_KEY_PASSWORD.
// keystore.properties is listed in .gitignore and must NEVER be committed. No real keystore is shipped with this repo.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) { keystorePropsFile.withInputStream { keystoreProps.load(it) } }
def ksPath = System.getenv('PARLOUR_KEYSTORE') ?: keystoreProps.getProperty('storeFile')
def ksStorePassword = System.getenv('PARLOUR_STORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
def ksKeyAlias = System.getenv('PARLOUR_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
def ksKeyPassword = System.getenv('PARLOUR_KEY_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
android {
 signingConfigs {
  release {
   if (ksPath) {
    storeFile file(ksPath)
    storePassword ksStorePassword
    keyAlias ksKeyAlias
    keyPassword ksKeyPassword
   }
  }
 }
 namespace 'com.parlour.management'
 compileSdk 35
 defaultConfig {
  applicationId 'com.parlour.management'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '0.1.0-preview'
 }
 buildFeatures { viewBinding true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 buildTypes {
  debug {
   buildConfigField 'String', 'API_BASE_URL', '"' + (configuredApiBase ?: 'http://10.0.2.2:8080') + '"'
  }
  release {
   def releaseApi = configuredApiBase ?: ''
   if (!releaseApi.isBlank() && !releaseApi.startsWith('https://')) {
    throw new GradleException('Release API_BASE_URL must use HTTPS')
   }
   buildConfigField 'String', 'API_BASE_URL', '"' + releaseApi + '"'
   minifyEnabled false
   signingConfig signingConfigs.release
  }
 }
 // Fail fast with a clear message when a release build is requested without signing configured.
 tasks.whenTaskAdded { t ->
  if (t.name in ['assembleRelease', 'bundleRelease']) {
   t.doFirst {
    def sf = signingConfigs.release.storeFile
    if (sf == null || !sf.exists()) {
     throw new GradleException('Release signing is not configured. Create a keystore.properties file at the repo root (see the comment at the top of android/app/build.gradle) or set PARLOUR_KEYSTORE/PARLOUR_STORE_PASSWORD/PARLOUR_KEY_ALIAS/PARLOUR_KEY_PASSWORD env vars, then rebuild. Refusing to ship an unsigned release build.')
    }
   }
  }
 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.android.gms:play-services-location:21.3.0'
 implementation platform('com.google.firebase:firebase-bom:34.19.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-firestore'
 implementation 'com.google.firebase:firebase-messaging'
 implementation 'com.google.firebase:firebase-analytics'
 implementation 'com.google.firebase:firebase-crashlytics'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}
