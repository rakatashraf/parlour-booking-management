plugins { id 'com.android.application'; id 'com.google.gms.google-services'; id 'com.google.firebase.crashlytics' }
def configuredApiBase = project.findProperty('API_BASE_URL')
android {
 namespace 'com.parlour.management'
 compileSdk 35
 defaultConfig {
  applicationId 'com.parlour.management'
  minSdk 26
  targetSdk 35
  versionCode 1
  versionName '0.1.0-preview'
 }
 buildFeatures { viewBinding true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 buildTypes {
  debug {
   buildConfigField 'String', 'API_BASE_URL', '"' + (configuredApiBase ?: 'http://10.0.2.2:8080') + '"'
  }
  release {
   def releaseApi = configuredApiBase ?: ''
   if (!releaseApi.isBlank() && !releaseApi.startsWith('https://')) {
    throw new GradleException('Release API_BASE_URL must use HTTPS')
   }
   buildConfigField 'String', 'API_BASE_URL', '"' + releaseApi + '"'
   minifyEnabled false
  }
 }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.android.gms:play-services-location:21.3.0'
 implementation platform('com.google.firebase:firebase-bom:34.19.0')
 implementation 'com.google.firebase:firebase-auth'
 implementation 'com.google.firebase:firebase-firestore'
 implementation 'com.google.firebase:firebase-messaging'
 implementation 'com.google.firebase:firebase-analytics'
 implementation 'com.google.firebase:firebase-crashlytics'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}
